<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSO Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
    }
    .login-card {
      padding: 2rem;
      border-radius: 1rem;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<div class="login-card text-center">
    <h3 class="mb-4">Welcome to MyApp</h3>
    <p>Login using your Google account</p>
    <a href="http://localhost:8080/posthub/oauth2/authorization/google" class="btn btn-danger btn-lg mt-3">
        <img src="https://img.icons8.com/color/16/000000/google-logo.png"/> Sign in with Google
    </a>
</div>
</body>
</html>
